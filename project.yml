name: Earshot
options:
  bundleIdPrefix: media.payown
  defaultConfig: Release
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
  CloudKitDevelopment: release
fileGroups:
  - Earshot/Testing
settings:
  base:
    MARKETING_VERSION: "1.2.6"
    CURRENT_PROJECT_VERSION: "309"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Earshot:
    type: application
    platform: iOS
    sources:
      - path: Earshot
        excludes:
          - "Testing/**"
      - path: docs/inbox-queue-downloads-guide.md
        buildPhase: resources
    dependencies:
      - target: EarshotWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: media.payown.earshot
        INFOPLIST_FILE: Earshot/App/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: "72PH974742"
        CODE_SIGN_STYLE: Automatic
        EARSHOT_CLOUDKIT_ENABLED: NO
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          EARSHOT_CLOUDKIT_ENABLED: YES
        CloudKitDevelopment:
          EARSHOT_CLOUDKIT_ENABLED: YES
    entitlements:
      path: Earshot/App/Earshot.entitlements
      properties:
        aps-environment: development
        com.apple.developer.icloud-container-identifiers:
          - iCloud.media.payown.earshot
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)media.payown.earshot
  EarshotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EarshotTests
    resources:
      - path: EarshotTests/Fixtures/PersonalAudioChapters.m4a
      - path: EarshotTests/Fixtures/PersonalAudioChapters.mp3
    dependencies:
      - target: Earshot
      - sdk: StoreKitTest.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: media.payown.earshot.tests
        DEVELOPMENT_TEAM: "72PH974742"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
  EarshotUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: EarshotUITests
    dependencies:
      - target: Earshot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: media.payown.earshot.uitests
        DEVELOPMENT_TEAM: "72PH974742"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
  EarshotWatch:
    type: application
    platform: watchOS
    info:
      path: EarshotWatch/Info.plist
      properties:
        CFBundleDisplayName: Earshot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        EarshotCloudKitEnabled: $(EARSHOT_CLOUDKIT_ENABLED)
        WKApplication: true
        WKCompanionAppBundleIdentifier: media.payown.earshot
        WKRunsIndependentlyOfCompanionApp: true
        UIBackgroundModes: [audio]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsForMedia: true
        CFBundleURLTypes:
          - CFBundleURLName: media.payown.earshot.watchkitapp
            CFBundleURLSchemes: [earshot-watch]
    entitlements:
      path: EarshotWatch/EarshotWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.media.payown.earshot.watch
        com.apple.developer.icloud-container-identifiers:
          - iCloud.media.payown.earshot
        com.apple.developer.icloud-services:
          - CloudKit
    sources:
      - path: EarshotWatch
      - path: Earshot/Features/Subscriptions/Data/RSSParser.swift
      - path: Earshot/Features/Transcripts/Domain/TranscriptFormat.swift
      - path: Earshot/Core/Logging/Logger+Earshot.swift
      - path: Earshot/Core/WatchFeedSnapshot.swift
      - path: Earshot/Core/EpisodeSummary.swift
      - path: Earshot/Data/Persistence/CloudProjectionModels.swift
      - path: Earshot/Data/Persistence/FeedURLIdentity.swift
      - path: Earshot/Data/Persistence/CloudKitLaunchPolicy.swift
      - path: Earshot/Features/Player/Domain/SleepTimer.swift
      - path: Earshot/Features/Player/Domain/Chapter.swift
      - path: Earshot/Features/Player/Domain/ChapterParser.swift
      - path: Earshot/Features/Player/Domain/ChapterNavLogic.swift
      - path: Earshot/Features/Monetization/Domain/EarshotPlusProduct.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: media.payown.earshot.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: "72PH974742"
        CODE_SIGN_STYLE: Automatic
        EARSHOT_CLOUDKIT_ENABLED: NO
      configs:
        Release:
          EARSHOT_CLOUDKIT_ENABLED: YES
        CloudKitDevelopment:
          EARSHOT_CLOUDKIT_ENABLED: YES
    dependencies:
      - target: EarshotWatchWidgets
        embed: true
  EarshotWatchWidgets:
    type: app-extension
    platform: watchOS
    info:
      path: EarshotWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Earshot Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: EarshotWatchWidgets/EarshotWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.media.payown.earshot.watch
    sources:
      - path: EarshotWatchWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: media.payown.earshot.watchkitapp.widgets
        DEVELOPMENT_TEAM: "72PH974742"
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
  EarshotWatchTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - path: EarshotWatchTests
    dependencies:
      - target: EarshotWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: media.payown.earshot.watchkitapp.tests
        GENERATE_INFOPLIST_FILE: YES
  EarshotWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - path: EarshotWatchUITests
    dependencies:
      - target: EarshotWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: media.payown.earshot.watchkitapp.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Earshot:
    build:
      targets:
        Earshot: all
        EarshotTests: [test]
        EarshotUITests: [test]
    test:
      targets:
        - EarshotTests
        - EarshotUITests
      gatherCoverageData: true
      storeKitConfiguration: Earshot/Testing/Configuration.storekit
    run:
      config: Debug
      storeKitConfiguration: Earshot/Testing/Configuration.storekit
  Earshot CloudKit Development:
    build:
      targets:
        Earshot: all
    run:
      config: CloudKitDevelopment
  EarshotWatch:
    build:
      targets:
        EarshotWatch: all
        EarshotWatchTests: [test]
        EarshotWatchUITests: [test]
    test:
      targets:
        - EarshotWatchTests
        - EarshotWatchUITests
    run:
      config: Debug
