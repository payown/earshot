name: CI

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!docs/**'
      - '!README.md'
      - '!CHANGELOG.md'
      - '!.github/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Format check
        run: dart format --set-exit-if-changed lib/ test/

      - name: Analyze
        run: flutter analyze --dart-define=PODCAST_INDEX_API_KEY=stub --dart-define=PODCAST_INDEX_API_SECRET=stub

      - name: Run tests
        run: flutter test --coverage --dart-define=PODCAST_INDEX_API_KEY=stub --dart-define=PODCAST_INDEX_API_SECRET=stub

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info

