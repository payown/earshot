name: Swift CI

# Runs the native SwiftUI/SwiftData test suites so PRs into `main` are
# gated on them actually passing, not on a human/agent
# remembering to run `xcodebuild test` locally. See issue #656.
#
# Runs on a SELF-HOSTED runner on Michael's Mac (no GitHub-hosted macOS
# minutes are ever billed). Migrated off `macos-15` after GitHub Actions
# billing blocked all hosted-runner jobs.
#
# No path filters: PRs into `main` are effectively always SwiftUI-app work,
# and an unfiltered trigger keeps this safe to mark "Required" in branch
# protection (a path-filtered required check that never fires on a given PR
# leaves that PR permanently pending).

on:
  workflow_dispatch:
  pull_request:
    branches: [main, swift]
  push:
    branches: [main, swift]

# Per-ref concurrency: pushing a new commit to a branch cancels that branch's
# now-stale in-flight run. Across DIFFERENT PRs, serialization is guaranteed by
# there being a single self-hosted runner — it executes one job at a time and
# queues the rest, so only one CI run ever runs on this Mac at once, without
# risking a cancelled (merge-blocking) required check on an unrelated PR.
concurrency:
  group: swift-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (EarshotTests)
    # Self-hosted runner on Michael's Apple Silicon Mac. These labels must
    # match the labels the runner registers with (default self-hosted + the
    # OS/arch labels the runner auto-applies).
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # This Mac has a public Xcode 27.0 already selected
      # via `xcode-select`, plus a dedicated CI simulator. No setup-xcode
      # action is needed (that was for GitHub's hosted images).
      - name: Show Xcode and CI simulator
        run: |
          xcodebuild -version
          # Dedicated CI simulator — reserved for CI, never used by dev agents
          # (see the pinned-simulator standing rule). Fail loudly if it's gone.
          xcrun simctl list devices | grep "23F12FE1-0D77-4B42-B766-ADD9F27A2153" || {
            echo "::error::Dedicated CI simulator (CI-iPhone-17, 23F12FE1-0D77-4B42-B766-ADD9F27A2153) not found. Recreate: xcrun simctl create 'CI-iPhone-17' 'iPhone 17' com.apple.CoreSimulator.SimRuntime.iOS-26-5"
            exit 1
          }

      # The simulator belongs exclusively to CI. A fresh boot clears stale
      # test runners and automation sessions left by earlier jobs.
      - name: Restart CI simulator
        run: |
          simulator_id=23F12FE1-0D77-4B42-B766-ADD9F27A2153
          if xcrun simctl list devices booted | grep -q "$simulator_id"; then
            xcrun simctl shutdown "$simulator_id"
          fi
          xcrun simctl bootstatus "$simulator_id" -b

      # The Earshot.xcodeproj is committed to the repo; local devs regenerate
      # it from project.yml with `xcodegen generate` only when project.yml
      # changes, then commit the result. CI builds the committed project
      # directly and does not run xcodegen.
      #
      # CODE_SIGNING_ALLOWED=NO / CODE_SIGNING_REQUIRED=NO: the project's
      # Automatic signing references a real DEVELOPMENT_TEAM, but simulator
      # test runs need no signing identity.
      #
      # Destination pinned to the dedicated CI simulator by UDID (not
      # `name=iPhone 17`, which matches multiple devices and caused runner
      # contention when several builds ran at once).
      # Retry failed test cases once inside this run to absorb occasional
      # simulator test-runner exits without rerunning the whole CI job.
      # Keep this run's result bundle separate from historical local results.
      - name: Run Earshot tests
        id: tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Earshot.xcodeproj \
            -scheme Earshot \
            -configuration Debug \
            -destination 'platform=iOS Simulator,id=23F12FE1-0D77-4B42-B766-ADD9F27A2153' \
            -resultBundlePath "$RUNNER_TEMP/EarshotTests-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.xcresult" \
            -retry-tests-on-failure \
            -test-iterations 2 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Archive xcresult on failure
        if: failure() && steps.tests.outcome == 'failure'
        run: |
          result="$RUNNER_TEMP/EarshotTests-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.xcresult"
          if [[ -d "$result" ]]; then
            ditto -c -k --keepParent "$result" "$RUNNER_TEMP/EarshotTests-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.zip"
          else
            echo "::warning::No test result bundle was created."
          fi

      - name: Upload xcresult on failure
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: swift-test-results
          path: ${{ runner.temp }}/EarshotTests-${{ github.run_id }}-${{ github.run_attempt }}.zip
          retention-days: 14
          if-no-files-found: ignore
          compression-level: 0
