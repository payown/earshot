name: Earshot
options:
  bundleIdPrefix: media.payown
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "143"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  Earshot:
    type: application
    platform: iOS
    sources:
      - path: Earshot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: media.payown.earshot
        INFOPLIST_FILE: Earshot/App/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: "72PH974742"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
  EarshotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EarshotTests
    dependencies:
      - target: Earshot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: media.payown.earshot.tests
        DEVELOPMENT_TEAM: "72PH974742"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Earshot:
    build:
      targets:
        Earshot: all
        EarshotTests: [test]
    test:
      targets:
        - EarshotTests
      gatherCoverageData: true
    run:
      config: Debug
